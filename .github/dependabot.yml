version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Without this only the crates named in Cargo.toml are checked, and the rest
    # of Cargo.lock moves only when one of them drags it along. That is how rustls
    # sat on a version with RUSTSEC-2026-0285 for three weeks: it comes in through
    # ureq, and no Dependabot alert was raised for it either.
    allow:
      - dependency-type: all
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/docs"
    # Dependabot cannot be told to check indirect npm dependencies the way it can
    # for cargo, so everything beneath the packages in package.json moves only
    # with a direct bump or a security update. A weekly run keeps that frequent.
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    ignore:
      # @astrojs/check declares peer typescript "^5.0.0 || ^6.0.0", so a major
      # bump of typescript makes `npm ci` fail with ERESOLVE and takes the whole
      # docs group down with it. Drop this once @astrojs/check accepts TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
