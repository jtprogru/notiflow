name: Parity

# Runs the golden corpus through the frozen v1 bash and the v2 binary and diffs them.
# Kept for as long as v1 is supported; retired when the v1.x branch is archived.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: Golden corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install the tools v1 needs
        run: sudo apt-get update && sudo apt-get install -y jq bats

      - name: Diff v1 against v2
        run: make parity

      # If the reference implementation itself has drifted, the corpus is comparing
      # against something that no longer behaves like v1 — so verify it too.
      - name: Verify the frozen v1 implementation
        run: make test-v1
