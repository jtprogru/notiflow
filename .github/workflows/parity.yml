name: Parity

# Runs the golden corpus through the frozen v1 bash and the v2 binary and diffs them.
# Kept for as long as v1 is supported; retired when the v1.x branch is archived.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    name: Golden corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install the tools v1 needs
        run: sudo apt-get update && sudo apt-get install -y jq bats

      - name: Diff v1 against v2
        run: make parity

      # If the reference implementation itself has drifted, the corpus is comparing
      # against something that no longer behaves like v1 — so verify it too.
      - name: Verify the frozen v1 implementation
        run: make test-v1
