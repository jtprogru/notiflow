name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'action.yml'
      - 'src/**'
      - 'scripts/gen-action-tables.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'action.yml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

# Per-ref, so two pull requests building docs do not cancel each other's check. The
# `pages` group that GitHub requires for serialised deploys is on the deploy job instead.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The generated tables come out of the Rust binary and action.yml, so the docs job
      # needs a toolchain even though the site itself is Node.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: make docs-install
      - run: make docs-build

      - name: Fail if generating the tables changed anything
        run: |
          if ! git diff --quiet -- docs/src/generated; then
            echo "::error::generated docs are stale; run 'make gen' and commit the result"
            git --no-pager diff -- docs/src/generated
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
