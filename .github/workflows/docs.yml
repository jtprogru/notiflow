name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'action.yml'
      - 'src/**'
      - 'scripts/gen-action-tables.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'action.yml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

# Per-ref, so two pull requests building docs do not cancel each other's check. The
# `pages` group that GitHub requires for serialised deploys is on the deploy job instead.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The generated tables come out of the Rust binary and action.yml, so the docs job
      # needs a toolchain even though the site itself is Node.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: make docs-install
      - run: make docs-build

      - name: Fail if generating the tables changed anything
        run: |
          if ! git diff --quiet -- docs/src/generated; then
            echo "::error::generated docs are stale; run 'make gen' and commit the result"
            git --no-pager diff -- docs/src/generated
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
