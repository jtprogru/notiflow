name: Security

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml', '.github/workflows/security.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml']
  schedule:
    # Weekly, so a freshly published advisory surfaces without waiting for a commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make audit

  deny:
    name: Licences, sources and duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make deny
