name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify the tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Cargo.toml and VERSION against the tag
        run: make version-check TAG="${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release archive
        shell: bash
        # rustls means no OpenSSL, so a static musl build needs nothing beyond musl-gcc.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: make dist TARGET=${{ matrix.target }}

      - name: Smoke-test the binary it just built
        # Cross-compiled x86_64 macOS runs under Rosetta; everything else is native.
        if: matrix.target != 'x86_64-unknown-linux-musl' || runner.arch == 'X64'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*) bin="target/${{ matrix.target }}/release/notiflow.exe" ;;
            *)         bin="target/${{ matrix.target }}/release/notiflow" ;;
          esac
          "$bin" --version
          "$bin" render --template 'ok {{.Status}}' | grep -q 'ok success'

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/notiflow-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Sign, attest and publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for keyless cosign signing and for build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Write checksums.txt
        run: |
          cd dist
          sha256sum notiflow-* > checksums.txt
          cat checksums.txt

      - uses: sigstore/cosign-installer@v3

      - name: Sign every archive (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          for f in dist/notiflow-*; do
            cosign sign-blob --bundle "${f}.bundle" "$f"
          done

      # GPG is the third signature channel here, behind cosign and the provenance
      # attestation. A missing key should degrade the release, not fail it — the first
      # v2 tag died at this step with everything else already built and published.
      - name: Is a GPG key configured?
        id: gpg
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY is not set; publishing without .asc signatures. \
            cosign signatures and build provenance are unaffected."
          fi

      - name: Import the GPG key
        if: steps.gpg.outputs.available == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: GPG-sign the archives and the checksum file
        if: steps.gpg.outputs.available == 'true'
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          for f in dist/notiflow-*.tar.gz dist/notiflow-*.zip dist/checksums.txt; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
              --armor --detach-sign "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/notiflow-*.tar.gz,dist/notiflow-*.zip'

      - name: Extract the release notes for this version
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(mktemp)"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "$notes"
          echo "file=${notes}" >> "$GITHUB_OUTPUT"
          if [ -s "$notes" ]; then echo "found=true" >> "$GITHUB_OUTPUT";
          else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.file || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/notiflow-*
            dist/checksums.txt*

  crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  homebrew:
    name: Update the Homebrew formula
    needs: publish
    # A pre-release should not become what `brew install notiflow` hands people.
    if: ${{ !contains(github.ref_name, '-') }}
    # The tap lives in another repository; without its token there is nothing to push to.
    # Failing the whole release over the formula would be the tail wagging the dog.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: jtprogru/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Import the GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Generate Formula/notiflow.rb
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          sha() { sha256sum "dist/$1" | awk '{print $1}'; }
          url() { echo "https://github.com/jtprogru/notiflow/releases/download/${TAG}/$1"; }

          MAC_ARM="notiflow-aarch64-apple-darwin.tar.gz"
          MAC_X86="notiflow-x86_64-apple-darwin.tar.gz"
          LINUX_X86="notiflow-x86_64-unknown-linux-gnu.tar.gz"
          LINUX_ARM="notiflow-aarch64-unknown-linux-gnu.tar.gz"

          mkdir -p Formula
          cat <<EOL > Formula/notiflow.rb
          class Notiflow < Formula
            desc "Telegram notifier for CI and the terminal"
            homepage "https://jtprogru.github.io/notiflow/"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "$(url "$MAC_ARM")"
                sha256 "$(sha "$MAC_ARM")"
              end
              on_intel do
                url "$(url "$MAC_X86")"
                sha256 "$(sha "$MAC_X86")"
              end
            end

            on_linux do
              on_intel do
                url "$(url "$LINUX_X86")"
                sha256 "$(sha "$LINUX_X86")"
              end
              on_arm do
                url "$(url "$LINUX_ARM")"
                sha256 "$(sha "$LINUX_ARM")"
              end
            end

            def install
              bin.install "notiflow"
              generate_completions_from_executable(bin/"notiflow", "completions")
            end

            test do
              assert_match "ok success", shell_output("#{bin}/notiflow render --template 'ok {{.Status}}'")
            end
          end
          EOL
          cat Formula/notiflow.rb

      - name: Commit and push
        run: |
          git add Formula/notiflow.rb
          git commit -S -m "Update notiflow to ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push origin main

  moving-tag:
    name: Move the major tag
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point vN at this release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          major="${tag%%.*}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${major}" -m "Update ${major} to ${tag}"
          git push --force origin "refs/tags/${major}"
