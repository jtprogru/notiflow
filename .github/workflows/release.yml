name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify the tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Cargo.toml and VERSION against the tag
        run: make version-check TAG="${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release archive
        shell: bash
        # rustls means no OpenSSL, so a static musl build needs nothing beyond musl-gcc.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: make dist TARGET=${{ matrix.target }}

      - name: Smoke-test the binary it just built
        # Cross-compiled x86_64 macOS runs under Rosetta; everything else is native.
        if: matrix.target != 'x86_64-unknown-linux-musl' || runner.arch == 'X64'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *windows*) bin="target/${{ matrix.target }}/release/notiflow.exe" ;;
            *)         bin="target/${{ matrix.target }}/release/notiflow" ;;
          esac
          "$bin" --version
          "$bin" render --template 'ok {{.Status}}' | grep -q 'ok success'

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/notiflow-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Sign, attest and publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for keyless cosign signing and for build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Write checksums.txt
        run: |
          cd dist
          sha256sum notiflow-* > checksums.txt
          cat checksums.txt

      - uses: sigstore/cosign-installer@v3

      - name: Sign every archive (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          for f in dist/notiflow-*; do
            cosign sign-blob --bundle "${f}.bundle" "$f"
          done

      # GPG is the third signature channel here, behind cosign and the provenance
      # attestation. A missing key should degrade the release, not fail it — the first
      # v2 tag died at this step with everything else already built and published.
      - name: Is a GPG key configured?
        id: gpg
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY is not set; publishing without .asc signatures. \
            cosign signatures and build provenance are unaffected."
          fi

      - name: Import the GPG key
        if: steps.gpg.outputs.available == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: GPG-sign the archives and the checksum file
        if: steps.gpg.outputs.available == 'true'
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          for f in dist/notiflow-*.tar.gz dist/notiflow-*.zip dist/checksums.txt; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
              --armor --detach-sign "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/notiflow-*.tar.gz,dist/notiflow-*.zip'

      - name: Extract the release notes for this version
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(mktemp)"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "$notes"
          echo "file=${notes}" >> "$GITHUB_OUTPUT"
          if [ -s "$notes" ]; then echo "found=true" >> "$GITHUB_OUTPUT";
          else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.found == 'true' && steps.notes.outputs.file || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/notiflow-*
            dist/checksums.txt*

  crates-io:
    name: Publish to crates.io
    # Last, and only after the GitHub release exists. A crate version cannot be unpublished,
    # so it is the one step here that must not run before everything reversible has passed.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` on an existing version is a hard error, which would turn a re-run of
      # a partially failed release into a red workflow for the one reason that does not
      # matter.
      - name: Is this version already on crates.io?
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'notiflow-release-workflow (+https://github.com/jtprogru/notiflow)' \
            "https://crates.io/api/v1/crates/notiflow/${version}")"
          if [ "$code" = "200" ]; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice::notiflow ${version} is already on crates.io; skipping cargo publish"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: cargo publish
        if: steps.published.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  homebrew:
    name: Update the Homebrew formula
    needs: publish
    # The tap lives in another repository; without its token there is nothing to push to.
    # Failing the whole release over the formula would be the tail wagging the dog.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      # A pre-release must not become what `brew install notiflow` hands people. Everything
      # else this job does — the tap checkout, the token, the GPG import, the generated
      # formula — is exactly what a release cannot afford to be attempting for the first
      # time on the stable tag, so a pre-release runs all of it and stops before the push.
      DRY_RUN: ${{ contains(github.ref_name, '-') }}
    steps:
      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: jtprogru/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Same reasoning as in `publish`: a missing key downgrades the commit to unsigned
      # rather than costing the tap its update.
      - name: Is a GPG key configured?
        id: gpg
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY is not set; the formula commit will be unsigned."
          fi

      - name: Import the GPG key
        if: steps.gpg.outputs.available == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Generate Formula/notiflow.rb
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          sha() { sha256sum "dist/$1" | awk '{print $1}'; }
          url() { echo "https://github.com/jtprogru/notiflow/releases/download/${TAG}/$1"; }

          MAC_ARM="notiflow-aarch64-apple-darwin.tar.gz"
          MAC_X86="notiflow-x86_64-apple-darwin.tar.gz"
          LINUX_X86="notiflow-x86_64-unknown-linux-gnu.tar.gz"
          LINUX_ARM="notiflow-aarch64-unknown-linux-gnu.tar.gz"

          mkdir -p Formula
          cat <<EOL > Formula/notiflow.rb
          class Notiflow < Formula
            desc "Telegram notifier for CI and the terminal"
            homepage "https://jtprogru.github.io/notiflow/"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "$(url "$MAC_ARM")"
                sha256 "$(sha "$MAC_ARM")"
              end
              on_intel do
                url "$(url "$MAC_X86")"
                sha256 "$(sha "$MAC_X86")"
              end
            end

            on_linux do
              on_intel do
                url "$(url "$LINUX_X86")"
                sha256 "$(sha "$LINUX_X86")"
              end
              on_arm do
                url "$(url "$LINUX_ARM")"
                sha256 "$(sha "$LINUX_ARM")"
              end
            end

            def install
              bin.install "notiflow"
              generate_completions_from_executable(bin/"notiflow", "completions")
            end

            test do
              assert_match "ok success", shell_output("#{bin}/notiflow render --template 'ok {{.Status}}'")
            end
          end
          EOL
          cat Formula/notiflow.rb

      - name: Commit and push
        env:
          SIGNED: ${{ steps.gpg.outputs.available }}
        run: |
          set -euo pipefail
          # The import action configures the committer identity; without it there is none.
          if [ "$SIGNED" != "true" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          git add Formula/notiflow.rb
          if git diff --cached --quiet; then
            echo "::notice::Formula/notiflow.rb is already current; nothing to commit"
            exit 0
          fi
          git diff --cached

          # `git_commit_gpgsign` sets commit.gpgsign, so the signature happens without -S
          # when a key was imported and does not block the commit when one was not.
          git commit -m "Update notiflow to ${GITHUB_REF_NAME}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::${GITHUB_REF_NAME} is a pre-release: formula generated and committed locally, not pushed"
            exit 0
          fi
          git push origin main

  moving-tag:
    name: Move the major tag
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point vN at this release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          major="${tag%%.*}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${major}" -m "Update ${major} to ${tag}"
          git push --force origin "refs/tags/${major}"
