name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  update-major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update moving major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          major="${tag%%.*}"            # v1.2.3 -> v1
          echo "Pinning ${major} to ${tag}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${major}" -m "Update ${major} to ${tag}"
          git push --force origin "refs/tags/${major}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes_file="$(mktemp)"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" { p=1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "No CHANGELOG entry for ${version}; falling back to autogenerated notes."
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --generate-notes
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$notes_file"
            else
              gh release create "$tag" --title "$tag" --notes-file "$notes_file"
            fi
          fi
