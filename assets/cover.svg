<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="notiflow — Telegram notifier for CI and the terminal: a GitHub Action and a CLI in one Rust binary">
  <title>notiflow</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a22"/>
      <stop offset="100%" stop-color="#0c1826"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#6C7CFF"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2AABEE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2AABEE" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dim  { fill: #8b949e; }
      .fg   { fill: #e6edf3; }
      .tg   { fill: #58c0ee; }
      .ind  { fill: #8b9dff; }
      .grn  { fill: #5BB359; }
      .cyn  { fill: #58c6d8; }
      .yel  { fill: #d8a657; }
      .orn  { fill: #e8813a; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="1060" cy="120" rx="460" ry="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- brand block -->
  <g transform="translate(72, 96)">
    <rect x="0" y="0" width="288" height="28" rx="14" fill="#2AABEE" fill-opacity="0.14" stroke="#2AABEE" stroke-opacity="0.45"/>
    <text class="mono tg" x="16" y="19" font-size="13" letter-spacing="1.6">RUST · GITHUB ACTION · CLI</text>

    <!-- paper-plane mark, same shape as the docs logo -->
    <g transform="translate(0, 44) scale(1.9)" fill="none" stroke="#2AABEE" stroke-width="2">
      <path d="M3 15.5 29 4l-4.2 24-8.1-5.6-3.6 3.9-.8-6.2Z" stroke-linejoin="round"/>
      <path d="m13.1 20.1 12-13.4" stroke-linecap="round"/>
    </g>

    <text class="mono fg" x="80" y="112" font-size="76" font-weight="700" letter-spacing="-1.5">notiflow</text>

    <text class="sans dim" x="2" y="158" font-size="24">Tell Telegram when something finished: a workflow job, a deploy, a long build.</text>
    <text class="sans dim" x="2" y="192" font-size="24">One Rust binary is both the Action and the CLI. No bash, no curl, no jq.</text>
  </g>

  <!-- terminal -->
  <g transform="translate(72, 330)" filter="url(#shadow)">
    <rect x="0" y="0" width="1136" height="232" rx="14" fill="#0a0e14" stroke="#2a313c"/>
    <rect x="0" y="0" width="1136" height="40" rx="14" fill="#161b22"/>
    <rect x="0" y="26" width="1136" height="14" fill="#161b22"/>
    <line x1="0" y1="40" x2="1136" y2="40" stroke="#2a313c"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="20" r="6" fill="#febc2e"/>
    <circle cx="68" cy="20" r="6" fill="#28c840"/>
    <text class="mono dim" x="568" y="25" font-size="13" text-anchor="middle">~/work/api-gw — zsh</text>

    <text class="mono" x="28" y="82" font-size="19"><tspan class="grn">➜</tspan><tspan class="cyn" dx="12">api-gw</tspan><tspan class="yel" dx="12">git:(</tspan><tspan class="grn">main</tspan><tspan class="yel">)</tspan><tspan class="fg" dx="14">./deploy.sh | notiflow send --stdin</tspan></text>
    <text class="mono fg" x="28" y="114" font-size="19" fill-opacity="0.92">sent to -1001234567890 (message_id=4242)</text>

    <text class="mono" x="28" y="160" font-size="19"><tspan class="grn">➜</tspan><tspan class="cyn" dx="12">api-gw</tspan><tspan class="yel" dx="12">git:(</tspan><tspan class="orn">fix/a.b-c</tspan><tspan class="yel">)</tspan><tspan class="fg" dx="14">notiflow render -T</tspan><tspan class="yel" dx="10">&#39;branch `{{.Branch}}`&#39;</tspan><tspan class="fg" dx="10">--explain</tspan></text>
    <text class="mono dim" x="28" y="190" font-size="15"># parse_mode: MarkdownV2<tspan dx="24"># truncated: false</tspan></text>
    <text class="mono fg" x="28" y="216" font-size="19" fill-opacity="0.92">branch `fix/a<tspan class="tg">\</tspan>.b<tspan class="tg">\</tspan>-c`</text>
  </g>

  <!-- capability chips -->
  <g transform="translate(72, 604)" class="mono" font-size="14">
    <g>
      <rect x="0" y="-18" width="64" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="32" y="0" text-anchor="middle">send</text>
    </g>
    <g transform="translate(76, 0)">
      <rect x="0" y="-18" width="82" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="41" y="0" text-anchor="middle">render</text>
    </g>
    <g transform="translate(170, 0)">
      <rect x="0" y="-18" width="82" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="41" y="0" text-anchor="middle">whoami</text>
    </g>
    <g transform="translate(264, 0)">
      <rect x="0" y="-18" width="70" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="35" y="0" text-anchor="middle">HTML</text>
    </g>
    <g transform="translate(346, 0)">
      <rect x="0" y="-18" width="120" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="60" y="0" text-anchor="middle">MarkdownV2</text>
    </g>
    <g transform="translate(478, 0)">
      <rect x="0" y="-18" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="75" y="0" text-anchor="middle">retry + jitter</text>
    </g>
    <g transform="translate(640, 0)">
      <rect x="0" y="-18" width="150" height="26" rx="13" fill="#2AABEE" fill-opacity="0.10" stroke="#2AABEE" stroke-opacity="0.35"/>
      <text class="tg" x="75" y="0" text-anchor="middle">GitHub Action</text>
    </g>
  </g>

  <text class="mono dim" x="1208" y="604" font-size="14" text-anchor="end">github.com/jtprogru/notiflow</text>
</svg>
