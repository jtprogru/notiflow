name: 'notiflow — Telegram CI Notifier'
description: 'Send a Telegram message when a workflow job completes. Templates, retries, and a matching CLI.'
author: 'jtprogru'

branding:
  icon: 'send'
  color: 'blue'

inputs:
  bot_token:
    description: 'Telegram bot token (use a repository secret).'
    required: true
  chat_id:
    description: >-
      Target chat: an integer id (possibly negative) or @channelusername.
      Exactly one chat — the comma-separated form accepted by v1.5 was removed in v2.
      To notify several chats, use a job matrix or repeat the step.
    required: true
  status:
    description: >-
      Job status to report. Must be passed explicitly from the workflow, typically from
      the job.status or needs.<job>.result expression. Allowed values: success, failure,
      cancelled, skipped. Cannot be defaulted here — composite-action input defaults do
      not have access to the job context.
    required: true
  parse_mode:
    description: 'Telegram parse_mode: MarkdownV2 (default), HTML, Markdown, or none.'
    required: false
    default: 'MarkdownV2'
  notify_on:
    description: 'Comma-separated list of statuses that should trigger a notification. `any` or `all` means every status.'
    required: false
    default: 'success,failure,cancelled'
  message:
    description: 'Verbatim message text. Overrides every template. No placeholder substitution and no escaping are applied.'
    required: false
    default: ''
  message_template:
    description: 'Template string with {{.Field}} placeholders, used for all statuses not overridden by template_<status>.'
    required: false
    default: ''
  template_success:
    description: 'Template used when status=success. Overrides message_template.'
    required: false
    default: ''
  template_failure:
    description: 'Template used when status=failure. Overrides message_template.'
    required: false
    default: ''
  template_cancelled:
    description: 'Template used when status=cancelled. Overrides message_template.'
    required: false
    default: ''
  template_skipped:
    description: 'Template used when status=skipped. Overrides message_template.'
    required: false
    default: ''
  disable_web_page_preview:
    description: 'Suppress link previews. Sent as link_preview_options.is_disabled; the flat field Telegram deprecated is no longer used.'
    required: false
    default: 'true'
  disable_notification:
    description: 'Send the message silently (no sound for recipients).'
    required: false
    default: 'false'
  message_thread_id:
    description: 'Forum-chat thread (topic) ID. Integer.'
    required: false
    default: ''
  fail_on_error:
    description: 'If true, the action exits non-zero when the Telegram request ultimately fails. Default false keeps the job result intact.'
    required: false
    default: 'false'
  edit_message_id:
    description: >-
      If set, the message is edited via editMessageText instead of sent fresh. One integer,
      typically wired from the message_id output of an earlier notiflow step.
      disable_notification and message_thread_id are dropped when editing, because Telegram
      rejects them there.
    required: false
    default: ''
  version:
    description: 'notiflow release to install. Empty pins to the version stamped in the Action tree; "latest" resolves the newest release at run time.'
    required: false
    default: ''
  verify_signature:
    description: 'Verify the release archive with cosign before installing. Requires sigstore/cosign-installer earlier in the job.'
    required: false
    default: 'false'
  github_token:
    description: 'Token used to call the GitHub Releases API when resolving "latest".'
    required: false
    default: ${{ github.token }}

outputs:
  ok:
    description: 'true when the message was delivered, false otherwise.'
    value: ${{ steps.notiflow.outputs.ok }}
  message_id:
    description: 'Telegram message_id on success, empty otherwise. A single value — v1 returned a comma-separated list for multi-chat sends.'
    value: ${{ steps.notiflow.outputs.message_id }}
  http_status:
    description: 'HTTP status of the last attempt (0 when skipped or when no response arrived).'
    value: ${{ steps.notiflow.outputs.http_status }}
  error:
    description: 'Failure reason — Telegram .description when available, otherwise a synthesized reason. Empty on success and on skip.'
    value: ${{ steps.notiflow.outputs.error }}

runs:
  using: composite
  steps:
    # Every `run:` below reaches the action's own tree through $GITHUB_ACTION_PATH rather
    # than ${{ github.action_path }}. The expression is substituted into the script text
    # before bash parses it, and on a Windows runner its value is `D:\a\notiflow\notiflow`,
    # whose backslashes bash then eats as escapes: the command becomes `D:anotiflownotiflow`
    # and exits 127. The environment variable holds the same string but is never re-parsed.
    # Same reasoning for $RUNNER_TOOL_CACHE.
    - name: Resolve notiflow version
      id: ver
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: "$GITHUB_ACTION_PATH/scripts/action/resolve-version.sh"

    - name: Detect runner platform
      id: plat
      shell: bash
      run: "$GITHUB_ACTION_PATH/scripts/action/detect-platform.sh"

    - name: Restore notiflow binary cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/notiflow/${{ steps.ver.outputs.version }}/${{ steps.plat.outputs.target }}
        key: notiflow-${{ steps.ver.outputs.version }}-${{ steps.plat.outputs.target }}

    - name: Install notiflow
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.ver.outputs.version }}
        TARGET: ${{ steps.plat.outputs.target }}
        EXT: ${{ steps.plat.outputs.ext }}
        BINARY: ${{ steps.plat.outputs.binary }}
        DEST: ${{ runner.tool_cache }}/notiflow/${{ steps.ver.outputs.version }}/${{ steps.plat.outputs.target }}
        VERIFY_SIGNATURE: ${{ inputs.verify_signature }}
      run: "$GITHUB_ACTION_PATH/scripts/action/install.sh"

    - name: Add notiflow to PATH
      shell: bash
      env:
        DEST: ${{ runner.tool_cache }}/notiflow/${{ steps.ver.outputs.version }}/${{ steps.plat.outputs.target }}
      run: echo "$DEST" >>"$GITHUB_PATH"

    - name: Send notification
      id: notiflow
      shell: bash
      env:
        NF_BOT_TOKEN: ${{ inputs.bot_token }}
        NF_CHAT_ID: ${{ inputs.chat_id }}
        NF_STATUS: ${{ inputs.status }}
        NF_PARSE_MODE: ${{ inputs.parse_mode }}
        NF_NOTIFY_ON: ${{ inputs.notify_on }}
        NF_MESSAGE: ${{ inputs.message }}
        NF_MESSAGE_TEMPLATE: ${{ inputs.message_template }}
        NF_TEMPLATE_SUCCESS: ${{ inputs.template_success }}
        NF_TEMPLATE_FAILURE: ${{ inputs.template_failure }}
        NF_TEMPLATE_CANCELLED: ${{ inputs.template_cancelled }}
        NF_TEMPLATE_SKIPPED: ${{ inputs.template_skipped }}
        NF_DISABLE_WEB_PAGE_PREVIEW: ${{ inputs.disable_web_page_preview }}
        NF_DISABLE_NOTIFICATION: ${{ inputs.disable_notification }}
        NF_MESSAGE_THREAD_ID: ${{ inputs.message_thread_id }}
        NF_FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
        NF_EDIT_MESSAGE_ID: ${{ inputs.edit_message_id }}
      run: "$GITHUB_ACTION_PATH/scripts/action/run.sh"
